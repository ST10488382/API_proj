name: .NET CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Web API
      run: |
        dotnet restore API_proj/API_proj1.csproj
        dotnet build API_proj/API_proj1.csproj --configuration Release --no-restore

    - name: Build MVC Project
      run: |
        dotnet restore RaceDay.web/RaceDay.web.csproj
        dotnet build RaceDay.web/RaceDay.web.csproj --configuration Release --no-restore
